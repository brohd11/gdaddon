name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version stamping and release notes need tags and full history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make package

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: notes
        with:
          version: v2.14.2
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.changelog }}
