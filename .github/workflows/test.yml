name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go.mod/go.sum are tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      # gofmt reports by printing paths and always exits 0, so an empty output is the
      # pass and the check has to be spelled out rather than run bare.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted -- run gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...

      - name: Test
        run: go test ./...
